<!--
  dsh-suggest-actions 图标 —— 带光标的输入框（2026-11-06 换标）
  与 0.1.13 起建议按钮里的「填入」图标同构：一个圆角输入框 + 左侧光标。
  含义直接：点一下，这句话就被放进输入框。
  品牌蓝 #4176e6 取自 DSH 主题的 brand-primary，放进界面不会有异物感。
  注意：本文件的 XML 注释里不能出现两个连续的短横线（会让标准解析器报错），
  所以上面提到主题变量名时省略了它前缀的那两个短横线。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="dsh-suggest-actions">
  <rect width="128" height="128" rx="28" fill="#4176e6"/>
  <rect x="22" y="36" width="84" height="56" rx="15" fill="none" stroke="#ffffff" stroke-width="9"/>
  <path d="M47 50v28" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
</svg>

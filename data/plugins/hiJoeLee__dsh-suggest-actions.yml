url: https://github.com/hiJoeLee/dsh-suggest-actions
name: hiJoeLee/dsh-suggest-actions
category: ui
description:
  en: Up to 5 clickable next steps under every reply — one click sends that sentence as your message. No extra model call, duplicate angles dropped, the recommended one moved to the top, and hovering a button shows the full text before you send it.
  zh: 每条回复下方给出最多 5 条可点的下一步：点一下那句话就直接发出去，不额外调用模型；角度重复的自动去掉，标了「推荐」的排最前，悬停可先看要发出去的全文。

  <rect x="26" y="36" width="76" height="15" rx="7.5" fill="#ffffff" opacity="0.95"/>
  <rect x="26" y="57" width="60" height="15" rx="7.5" fill="#ffffff" opacity="0.68"/>
  <rect x="26" y="78" width="44" height="15" rx="7.5" fill="#ffffff" opacity="0.42"/>
</svg>
